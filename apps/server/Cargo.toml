[package]
name = "server"
version.workspace = true
edition = "2024"
default-run = "server"

[features]
default = ["node"]
bun     = []
node    = []
compile = ["bun"]  # enabling compile automatically enables bun; requires bun at build time

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
dotenv = "0.15.0"
phantom-frame = "0.1.14"
rust-embed = { version = "8.9.0", features = ["include-exclude"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tower = "0.5.2"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
